<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhakti Baisa Collection</title>
<style>
body{font-family:Arial;text-align:center;background:#fff8f0;margin:0;padding:10px}
h1{color:#b30059}
input,select{width:90%;max-width:350px;padding:12px;margin:8px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#b30059;color:white;border:none;padding:13px 25px;border-radius:25px;font-size:16px;cursor:pointer}
.card{border:1px solid #ddd;border-radius:12px;padding:10px;margin:15px auto;max-width:350px;background:white}
.card img{width:100%;border-radius:10px}
#popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);justify-content:center;align-items:center}
#popup div{background:white;padding:25px;border-radius:12px}
</style>
</head>
<body>

<h1>Bhakti Baisa Collection</h1>
<p>Th. Bakhatgarh</p>

<h3>Order Form</h3>
<input id="naam" placeholder="Apna Naam"><br>
<input id="mobile" placeholder="Mobile Number" type="tel"><br>
<select id="product">
<option>Blue Lehenga - Rs.2500</option>
<option>Green Rajputi Poshak - Rs.3500</option>
<option>Pink Lehenga - Rs.2800</option>
<option>Red Poshak - Rs.3200</option>
<option>Yellow Lehenga - Rs.2200</option>
</select><br><br>
<button onclick="OrderKaro('General Order')">Order Bhejo</button>

<div class="card">
<h3>Blue Lehenga - Rs.2500</h3>
<button onclick="OrderKaro('Blue Lehenga','Rs.2500')">Order Karo</button>
</div>

<div class="card">
<h3>Green Rajputi Poshak - Rs.3500</h3>
<button onclick="OrderKaro('Green Rajputi Poshak','Rs.3500')">Order Karo</button>
</div>

<div id="popup"><div><h2>Dhanyawad!</h2><p>Aapka Order mil gaya hai.</p><button onclick="document.getElementById('popup').style.display='none'">Band Karo</button></div></div>

<script>
function OrderKaro(product,price){
if(product=='General Order'){ product=document.getElementById('product').value; }
let n=document.getElementById('naam').value;
let m=document.getElementById('mobile').value;
if(!n||!m){ alert('Pehle apna Naam aur Mobile number likho'); return; }
let msg='Namaste! Mujhe Order Karna Hai\n\nNaam: '+n+'\nMobile: '+m+'\nProduct: '+product;
window.open('https://wa.me/918463075902?text='+encodeURIComponent(msg),'_blank');
document.getElementById('popup').style.display='flex';
}
</script>

</body>
</html>
